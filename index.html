<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- PWA -->
    <meta name="theme-color" content="#000000">
    <meta name="description" content="3D Mouse Parallax PWA">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <title>3D Mouse Parallax PWA</title>

    <style>

        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        }

        body{
        height:100vh;
        overflow:hidden;
        font-family:sans-serif;
        background:black;
        }

        .scene{
        position:relative;
        width:100%;
        height:100vh;
        overflow:hidden;
        perspective:1000px;
        }

        .layer{
        position:absolute;
        width:110%;
        height:110%;
        top:-5%;
        left:-5%;
        display:flex;
        justify-content:center;
        align-items:center;
        pointer-events:none;
        transition:transform 0.1s linear;
        }

        /* SKY */
        .sky{
        background-image:url("https://plus.unsplash.com/premium_photo-1673491310189-71ec407a592b?q=80&w=1575&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
        background-size:cover;
        background-position:center;
        z-index:1;
        }

        /* PNG TEXT */
        .text{
        z-index:2;
        }

        .text img{
        position:absolute;
        top:10px;
        width:500px;
        max-width:200%;
        }

        /* BUILDINGS */
        .buildings{
        z-index:3;
        bottom:0;
        align-items:flex-end;
        }

        .buildings img{
        width:600px;
        }

        /* STONES */
        .stones{
        z-index:5;
        display:block;
        }

        .stone{
        position:absolute;
        width:90px;
        animation:float 6s ease-in-out infinite;
        }

        /* positions */

        .s1{
        top:25%;
        left:20%;
        width:120px;
        animation-delay:0s;
        }

        .s2{
        top:70%;
        left:80%;
        width:120px;
        animation-delay:0s;
        }

        .s3{
        top:70%;
        left:25%;
        animation-delay:0s;
        }

        .s4{
        top:15%;
        left:60%;
        animation-delay:0s;
        }

        /* floating motion */

        @keyframes float{

        0%{
        transform:translateY(0px) rotate(0deg);
        }

        50%{
        transform:translateY(-20px) rotate(5deg);
        }

        100%{
        transform:translateY(0px) rotate(0deg);
        }

        }

        /* INSTALL BUTTON */
        #installBtn{
        position:fixed;
        bottom:20px;
        right:20px;
        padding:12px 20px;
        border:none;
        border-radius:10px;
        background:#111;
        color:white;
        font-size:16px;
        cursor:pointer;
        z-index:999;
        display:none;
        }

    </style>
</head>

<body>

<button id="installBtn">Install App</button>

<div class="scene">

    <!-- SKY -->
    <div class="layer sky"></div>

    <!-- PNG TEXT -->
    <div class="layer text">
        <img src="https://pngimg.com/uploads/assassins_creed/assassins_creed_PNG83.png">
    </div>

    <!-- FLOATING STONES -->
    <div class="layer stones">

        <img class="stone s1" src="https://pngimg.com/uploads/stone/stone_PNG13595.png">
        <img class="stone s2" src="https://pngimg.com/uploads/stone/stone_PNG13595.png">
        <img class="stone s3" src="https://pngimg.com/uploads/star/star_PNG76822.png">
        <img class="stone s4" src="https://pngimg.com/uploads/star/star_PNG76822.png">

    </div>

    <!-- BUILDING -->
    <div class="layer buildings">
        <img src="https://pngimg.com/uploads/assassins_creed/assassins_creed_PNG82.png">
    </div>

</div>

<script>

const scene = document.querySelector(".scene")
const sky = document.querySelector(".sky")
const text = document.querySelector(".text")
const buildings = document.querySelector(".buildings")
const stones = document.querySelector(".stones")

scene.addEventListener("mousemove",(e)=>{

let x = (window.innerWidth / 2 - e.clientX) / 20
let y = (window.innerHeight / 2 - e.clientY) / 20

sky.style.transform = `translate(${x*3}px, ${y*3}px)`
text.style.transform = `translate(${x}px, ${y}px)`
stones.style.transform = `translate(${x*1.5}px, ${y*1.5}px)`
buildings.style.transform = `translate(${-x*0.5}px, ${-y*0.5}px)`

})

/* SERVICE WORKER */

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("Service Worker Registered"))
        .catch(err => console.log(err))
    })
}

/* INSTALL APP */

let deferredPrompt
const installBtn = document.getElementById("installBtn")

window.addEventListener("beforeinstallprompt", (e) => {

    e.preventDefault()
    deferredPrompt = e
    installBtn.style.display = "block"

})

installBtn.addEventListener("click", async () => {

    if(deferredPrompt){

        deferredPrompt.prompt()

        const { outcome } = await deferredPrompt.userChoice

        if(outcome === "accepted"){
            console.log("PWA Installed")
        }

        deferredPrompt = null
        installBtn.style.display = "none"
    }

})

</script>

</body>
</html>
